# ── About ────────────────────────────────────────────────────────────────────
[about]
text = """
I am a theoretical chemist working on **coupled-cluster theory**, the hierarchy of methods that
underpins much of high-accuracy quantum chemistry. My work sits where method development meets
implementation: deriving the equations, generating them automatically, and making them run in
production electronic-structure codes such as [DIRAC](https://diracprogram.org) and
[eT](https://etprogram.org).

I obtained my PhD in Theoretical Chemistry at the Université de Toulouse with Dr. Trond Saue,
working on highly accurate relativistic coupled-cluster methods for molecular properties.
I am now a researcher at NTNU in Norway.
"""

# ── Now ──────────────────────────────────────────────────────────────────────
[now]
heading = "OpenQuantum"
place   = "NTNU · Trondheim"
text = """
I am part of the **OpenQuantum** project, where I develop coupled-cluster theory for
*electronically open systems* — molecules and extended systems, such as surfaces, that exchange
electrons with their surroundings.

A first ingredient is the reference: I implemented fractional-occupation (FON-UHF) and
state-averaged (SA-UHF) Hartree–Fock in eT, and studied the spurious *ensemble ghost interaction*
that appears in fractional-occupation Hartree–Fock.
"""

# ── Research lines ───────────────────────────────────────────────────────────
#  Add or remove [[research]] blocks freely. `icon` is one of:
#  open, relativity, nucleus, code
[[research]]
icon  = "open"
title = "Coupled cluster for open systems"
text  = """
Extending coupled-cluster theory to molecules and surfaces whose electron number is not fixed,
starting from ensemble and fractional-occupation reference states.
"""

[[research]]
icon  = "relativity"
title = "Relativistic coupled-cluster theory"
text  = """
High-order relativistic coupled cluster (up to CCSDTQ) and its expectation values, for molecules
containing heavy elements where relativity cannot be treated as a small correction.
"""

[[research]]
icon  = "nucleus"
title = "Nuclear electric quadrupole moments"
text  = """
Highly accurate electric field gradients at nuclei, combined with experimental spectroscopy,
to extract reliable nuclear quadrupole moments from molecular systems.
"""

# ── PhD ──────────────────────────────────────────────────────────────────────
[phd]
title    = "Highly Accurate Molecular Properties using High-Order Relativistic Coupled Cluster Theory"
place    = "Université de Toulouse · Laboratoire de Chimie et Physique Quantiques"
period   = "2022 – 2025"
defended = "5 December 2025"
advisor  = "Dr. Trond Saue"
project  = "HAMP-vQED"
text = """
During my PhD I was a member of the **HAMP-vQED** project, focused on highly accurate relativistic
coupled-cluster methods.

I developed a diagram-based framework for the **automated generation of expectation values at
arbitrary excitation rank**, built on the `tenpi` equation generator, and used it to implement
expectation values at the CCSDT and CCSDTQ levels in the DIRAC program package.

The main target was the electric field gradient (EFG) at nuclear positions — both its chemical
interpretation beyond the Dailey–Townes model and its use for the reliable extraction of nuclear
electric quadrupole moments, such as that of ⁸⁷Sr.
"""

# Highlights shown as a short list next to the PhD text
highlights = [
  "Automated Λ-equations and CC density matrices at arbitrary excitation rank (`tenpi`)",
  "CCSDT and CCSDTQ expectation values in DIRAC",
  "Chemical analysis of the electric field gradient beyond Dailey–Townes",
  "Nuclear quadrupole moment of ⁸⁷Sr from molecular calculations",
]

